name: publish-to-npm

# The version is never committed back to this repo: electerm/electerm passes the
# release tag in the dispatch payload and CI stamps it onto package.json right
# before publishing. That way the published version can never drift from the
# release it was built for, and there is no bot commit to babysit.
on:
  # Fired by electerm/electerm when a release is published
  # (.github/workflows/trigger-npm-publish.yml there).
  repository_dispatch:
    types: [electerm-release]
  # Manual re-publish / backfill.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, x.y.z (e.g. 5.5.16)'
        required: true
        type: string
  # Tagging this repo directly is also supported.
  push:
    tags:
      - 'v*'

# id-token: write is REQUIRED for npm trusted publishing (OIDC) to work
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node and npm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Resolve version
        id: ver
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          raw="${DISPATCH_VERSION:-${INPUT_VERSION:-$REF_NAME}}"
          ver="${raw#v}"
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Not an x.y.z version: '$raw'"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Skip if already published
        id: check
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          existing="$(npm view "electerm@${VERSION}" version 2>/dev/null || true)"
          if [ "$existing" = "$VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::electerm@${VERSION} is already on npm, nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package version
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Guards against a regression in the `files` field silently shipping an
      # empty or bloated tarball.
      - name: Verify tarball contents
        if: steps.check.outputs.skip != 'true'
        run: npm pack --dry-run

      # TEMPORARY DIAGNOSTIC (branch-only, never merge).
      # The registry answers the token exchange with a bare 404 "package not
      # found", which does not distinguish "no trusted publisher configured"
      # from "a trusted publisher is configured but the OIDC claims don't
      # match". Exchanging for a package we KNOW has a record (electerm-react,
      # owned by electerm/electerm) makes the two cases tell themselves apart.
      - name: Probe npm OIDC token exchange
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          id_token="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | jq -r .value)"
          for pkg in electerm '@electerm%2Felecterm-react'; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${id_token}" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg}")"
            echo "::group::exchange ${pkg} -> HTTP ${code}"
            cat /tmp/body
            echo
            echo "::endgroup::"
          done

      # Trusted publishing: do NOT pass a token. npm authenticates via the
      # GitHub OIDC token. Clear NODE_AUTH_TOKEN so no legacy token is used.
      #
      # --loglevel verbose is deliberate: npm's OIDC token exchange never throws,
      # it returns undefined after a `verbose`-level log, so a rejected trusted
      # publisher (wrong repo / workflow filename / environment) surfaces only as
      # a bare `ENEEDAUTH` at default log level. Verbose prints
      # `npm verbose oidc Failed token exchange request with body message: ...`.
      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ""
